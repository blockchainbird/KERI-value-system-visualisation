<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KERI Value System — Force-Directed Graph</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <main id="graph-container">
      <svg id="graph"></svg>
      <div id="legend"></div>
      <div id="graph-search">
        <input id="graph-search-input" class="search-input" type="search" placeholder="Search nodes by tag, description, KISS…" autocomplete="off" />
        <ul id="graph-search-results" class="search-results hidden"></ul>
      </div>
      <div id="tooltip" class="hidden"></div>
      <div id="graph-controls">
        <div id="level-toggle" role="group" aria-label="Explanation level">
          <button id="btn-level-beginner" type="button" data-level="beginner">Beginner</button>
          <button id="btn-level-expert" type="button" data-level="expert">Expert</button>
        </div>
        <div id="gravity-stepper" role="group" aria-label="Layout pull">
          <button type="button" id="btn-gravity-down" data-gravity="0" aria-label="Weaker pull">−</button>
          <button type="button" id="btn-gravity-up" data-gravity="100" aria-label="Stronger pull">+</button>
        </div>
        <button id="btn-panel-open" type="button" title="Open more">More…</button>
        <button id="btn-zoom-fit" title="Fit graph to view">Fit</button>
      </div>
    </main>

    <button id="panel-handle" type="button" aria-expanded="false" aria-controls="panel" title="Open more">
      More…
    </button>

    <aside id="panel" aria-hidden="true" inert>

      <header id="panel-header">
        <div id="panel-header-text">
          <h1>KERI Value System</h1>
          <p class="subtitle">
            Source:
            <a href="https://github.com/keri-foundation/CONF26-subtitles/issues/21" target="_blank" rel="noopener">
              CONF26-subtitles #21
            </a>
          </p>
        </div>
        <div id="file-section" class="editor-only">
          <div class="button-row">
            <button id="btn-load" title="Load a graph JSON file from disk">Load…</button>
            <button id="btn-save" title="Save the current graph to a JSON file">Save…</button>
            <button id="btn-reset" title="Restore the bundled default dataset">Reset</button>
          </div>
          <p class="hint" id="file-hint"></p>
        </div>
        <div id="editor-toggle" role="group" aria-label="Graph editor">
          <button id="btn-editor-off" type="button" data-editor="off">Editor off</button>
          <button id="btn-editor-on" type="button" data-editor="on">Editor on</button>
        </div>
        <button id="btn-panel-close" type="button" title="Close">Close</button>
      </header>

      <div id="panel-columns">
        <section class="panel-section" id="node-section">
          <h2>Nodes <span class="count" id="node-count"></span></h2>
          <div id="search-section">
            <input id="search-input" class="search-input" type="search" placeholder="Search nodes by tag, description, KISS…" autocomplete="off" />
            <ul id="search-results" class="search-results hidden"></ul>
          </div>
          <div class="row">
            <select id="node-select"></select>
            <button id="btn-add-node" class="small editor-only" title="Add a new node">+</button>
            <button id="btn-del-node" class="small danger editor-only" title="Delete selected node and its links">−</button>
          </div>
          <div id="node-form" class="form hidden editor-only">
            <label>Id <input id="node-id" type="text" /></label>
            <label>Label <input id="node-label" type="text" /></label>
            <label>Group <select id="node-group"></select></label>
            <label>Tag
              <select id="node-tag">
                <option value="">— none —</option>
                <option value="conscientious">conscientious</option>
                <option value="mature">mature</option>
              </select>
            </label>
            <label class="span-2">Weight (1–10)
              <span class="weight-row">
                <input id="node-weight" type="range" min="1" max="10" step="1" />
                <span class="range-value" id="node-weight-value"></span>
              </span>
            </label>
            <label class="span-2">Description (expert) <textarea id="node-description" rows="4"></textarea></label>
            <label class="span-2">KISS (beginner) <textarea id="node-kiss" rows="3"></textarea></label>
          </div>
        </section>

        <section class="panel-section" id="clips-section">
          <h2>Clips <span class="count" id="clip-count"></span></h2>
          <p class="hint" id="clips-hint"></p>
          <ul id="clip-list"></ul>
        </section>

        <section class="panel-section" id="link-section">
          <h2>Links <span class="count" id="link-count"></span></h2>
          <div class="form editor-only" id="link-add-form">
            <div class="row">
              <select id="link-source"></select>
              <span class="arrow">→</span>
              <select id="link-target"></select>
            </div>
            <div class="row">
              <label class="inline">Weight
                <select id="link-weight">
                  <option value="1">1</option>
                  <option value="2">2</option>
                  <option value="3">3</option>
                </select>
              </label>
              <button id="btn-add-link" class="small">Add / update</button>
            </div>
            <label>Connection context (expert)
              <textarea id="link-context" rows="2" placeholder="From the Vertices tab"></textarea>
            </label>
            <label>KISS (beginner)
              <textarea id="link-kiss" rows="2" placeholder="Plain-language connection"></textarea>
            </label>
            <label>Personas
              <input id="link-personas" type="text" placeholder="Optional" />
            </label>
          </div>
          <ul id="link-list"></ul>
        </section>
      </div>
    </aside>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
