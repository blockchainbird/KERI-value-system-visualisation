name: Refresh data and build

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  refresh:
    name: Fetch data and build the app
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch graph data from the Google Sheet
        run: npm run fetch-data

      - name: Fetch clips from SEGMENTS sub-issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run fetch-clips

      - name: Build persona playlists
        run: npm run build-personas

      - name: Production build
        run: npm run build

      - name: Deploy dist to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true

      - name: Upload generated data and dist
        uses: actions/upload-artifact@v4
        with:
          name: refresh-output
          path: |
            src/data/keri-values.json
            src/data/keri-clips.json
            src/data/keri-personas.json
            docs/persona-clips.md
            dist/
